<title>Análise Bancos Captives | Stellantis Finance</title>

<style>
  :root{
    --navy:#243782; --navy-dark:#1a2a63;
    --stla: rgb(36,55,130); --gm: rgb(0,120,190); --toyota: rgb(235,10,30);
    --volks: rgb(0,51,204); --rci: rgb(248,67,0);
    --bg:#eef0f4; --panel:#ffffff; --border:#e2e5ee;
    --text:#1c2333; --text-mut:#6b7286;
    --green:#16794f; --red:#c0341f; --gold:#a6791f;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);}
  .app{display:flex;min-height:100vh;}

  /* ---- MENU LATERAL ---- */
  nav.sidebar{
    width:260px;flex-shrink:0;background:var(--navy);color:#fff;
    display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;
  }
  .brand{padding:4px 10px 22px 10px;border-bottom:1px solid rgba(255,255,255,.18);margin-bottom:16px;}
  .brand .l1{font-weight:800;font-size:20px;letter-spacing:1px;}
  .brand .l2{font-size:13px;opacity:.85;margin-top:2px;}
  .menu{list-style:none;padding:0;margin:0;flex:1;}
  .menu li{margin-bottom:6px;}
  .menu button{
    width:100%;text-align:left;background:transparent;border:none;color:#fff;
    padding:11px 14px;border-radius:10px;font-size:14.5px;cursor:pointer;
    display:flex;align-items:center;gap:10px;font-family:inherit;transition:.15s;
  }
  .menu button:hover{background:rgba(255,255,255,.12);}
  .menu button.active{background:#ffffff;color:var(--navy);font-weight:700;}
  .menu .ic{font-size:16px;width:20px;text-align:center;}
  .footer-src{border-top:1px solid rgba(255,255,255,.18);padding-top:14px;font-size:11.5px;line-height:1.5;opacity:.9;}
  .source-toggle{display:flex;background:rgba(255,255,255,.12);border-radius:10px;padding:3px;margin-bottom:16px;gap:3px;}
  .source-btn{flex:1;border:none;background:transparent;color:#fff;opacity:.75;padding:8px 6px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;}
  .source-btn:hover{opacity:1;}
  .source-btn.active{background:#fff;color:var(--navy);opacity:1;}
  .menu li.hidden-source{display:none;}
  .footer-src b{display:block;margin-bottom:2px;}

  /* ---- CONTEÚDO ---- */
  main{flex:1;padding:28px 34px;max-width:1500px;}
  .page{display:none;}
  .page.active{display:block;}
  h1.page-title{font-size:22px;margin:0 0 4px 0;color:var(--navy);}
  .page-sub{color:var(--text-mut);font-size:13px;margin-bottom:22px;}

  .alert-bar{
    background:#fff6e9;border:1px solid #f0d7a8;color:#7a5410;
    padding:10px 14px;border-radius:8px;font-size:12.8px;margin-bottom:20px;line-height:1.5;
  }
  .alert-bar b{color:#5c3d0a;}

  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px;}
  @media(max-width:1200px){.grid4{grid-template-columns:repeat(2,1fr);}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(20,30,60,.06);}
  .card h3{margin:0 0 10px 0;font-size:13px;color:var(--text-mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
  .card canvas{max-height:210px;}

  .section-title{font-size:15.5px;font-weight:700;color:var(--navy);margin:30px 0 12px 0;padding-top:6px;border-top:1px solid var(--border);}
  .section-title:first-child{border-top:none;margin-top:0;}

  table{border-collapse:collapse;width:100%;font-size:13px;background:#fff;table-layout:fixed;}
  thead th{background:var(--navy);color:#fff;padding:9px 8px;text-align:center;font-weight:600;position:sticky;top:0;overflow:hidden;text-overflow:ellipsis;}
  thead th:first-child{text-align:center;width:22%;}
  thead th.highlight-col{text-align:center;background:var(--navy-dark);}
  tbody td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  tbody td:first-child{text-align:center;color:var(--text);white-space:normal;}
  tbody tr.subtotal td{font-weight:700;background:#f2f4fa;color:var(--gold);}
  tbody tr.no-border td{border-bottom:none;}
  tbody tr.pct td{color:var(--text-mut);font-size:11.3px;font-style:italic;border-bottom:1px solid var(--border);padding-top:0;}
  tbody tr.pct td.pos{color:var(--green);}
  tbody tr.pct td.neg{color:var(--red);}
  .valpos{color:var(--green);}
  .valneg{color:var(--red);}
  .nd{color:#b5b9c6;font-style:italic;}
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:#fff;box-shadow:0 1px 3px rgba(20,30,60,.06);}
  td.highlight-col{text-align:center;background:#f7f8fb;}
  .tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:10px;font-weight:700;white-space:nowrap;}
  .tag.lead{background:#e4f5ec;color:var(--green);}
  .tag.lag{background:#fbe9e6;color:var(--red);}
  .tag.nd{background:#f0f1f5;color:#9aa0b0;font-style:normal;font-weight:600;}

  .filters{display:flex;gap:10px;margin-bottom:14px;}
  select,.btn{padding:7px 12px;border-radius:8px;border:1px solid var(--border);font-size:13px;background:#fff;font-family:inherit;}

  .comp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
  @media(max-width:1300px){.comp-grid{grid-template-columns:repeat(2,1fr);}}
  .comp-card{border:1px solid var(--border);border-radius:12px;padding:14px;background:#fff;box-shadow:0 1px 3px rgba(20,30,60,.06);}
  .comp-card .head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .comp-card .dot{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
  .comp-card .name{font-weight:700;font-size:13.5px;}
  .comp-card dl{margin:0;font-size:12px;line-height:1.55;}
  .comp-card dt{color:var(--navy);font-weight:700;margin-top:8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.3px;}
  .comp-card dd{margin:0;}

  .kpi-tab-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .kpi-tab-bar button{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:12.5px;cursor:pointer;font-family:inherit;}
  .kpi-tab-bar button.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .hl-grid{display:grid;grid-template-columns:1fr;gap:16px;}
  .hl-card{border-radius:14px;padding:18px;background:#fff;color:var(--text);position:relative;overflow:hidden;border:1px solid var(--border);box-shadow:0 1px 3px rgba(20,30,60,.06);padding-left:24px;}
  .hl-card h4{color:var(--navy);}
  .hl-card .rationale{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .hl-card .rationale-title{font-size:11.5px;font-weight:700;color:var(--text-mut);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;}
  .hl-card h4{margin:0 0 10px 0;font-size:15px;}
  .hl-card ul{margin:0;padding-left:18px;font-size:12.6px;line-height:1.65;}
  .hl-card .stripe{position:absolute;top:0;left:0;width:6px;height:100%;}
</style>
</head>

<script>




























// ============ NÚCLEO ============
const DATA = JSON.parse(document.getElementById('data-json').textContent);
const ORDER = DATA.order; // stla, gm, toyota, volks, rci
const META = DATA.meta;

function fmtM(v){ // milhares -> R$ milhões, 1 casa
  if(v===null||v===undefined) return '<span class="nd">N/D</span>';
  const m = v/1000;
  return m.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
}
function fmtMcell(v){
  if(v===null||v===undefined) return '<span class="nd">N/D</span>';
  const m = v/1000;
  const cls = m<0? 'valneg':'';
  return `<span class="${cls}">${m.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})}</span>`;
}
function fmtPct(v,dec=1){
  if(v===null||v===undefined||isNaN(v)) return '<span class="nd">N/D</span>';
  const cls = v<0?'neg':'pos';
  return `<span class="${cls}">${v.toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec})}%</span>`;
}
function safeDiv(a,b){ if(a===null||a===undefined||b===null||b===undefined||b===0) return null; return a/b; }
function avg(a,b){ if(a===null||a===undefined) return null; if(b===null||b===undefined) return a; return (a+b)/2; }

// Equity ajustado da STLA = PL atribuível aos controladores + NCI do Banco Stellantis (exclui NCI de terceiros dos FIDCs)
// Média (2025+2024)/2, confirmado com a Nota 14.e — Participações Não Controladoras (Relatório Prudencial 2024, pág. 32)
function stlaAdjustedEquity(yearIdx){
  const p = DATA.pl_breakdown.stla;
  const eq2025 = p.atribuivel_controladores[0] + p.nci_banco_stellantis[0];
  const eq2024 = p.atribuivel_controladores[1] + p.nci_banco_stellantis[1];
  if(yearIdx===0) return eq2025;
  if(yearIdx===1) return eq2024;
  return avg(eq2025, eq2024);
}
// ROE padrão do dashboard: para STLA usa equity ajustado médio (exclui FIDC); demais bancos usam PL médio (2025+2024)/2
function roeFor(k){
  if(k==='stla'){ return safeDiv(DATA.dre.stla.lucro_liquido[0], stlaAdjustedEquity())*100; }
  return safeDiv(DATA.dre[k].lucro_liquido[0], avg(DATA.bs[k].pl[0],DATA.bs[k].pl[1]))*100;
}
// Fator de anualização por período: trimestre ×4 (÷3×12), semestre ×2 (÷6×12), ano cheio ×1.
function bacenAnnualFactor(period){
  if(period==='2026-T1' || period==='2025-T1') return 4;
  if(period==='2026-1S') return 2;
  return 1;
}
// ROAE base Bacen: Lucro Líquido (DRE Bacen) / PL Médio Bacen. Sem ajuste FIDC da STLA
// (a granularidade por entidade do NCI não está disponível na fonte Bacen).
// period: '2025' (padrão) usa lucro anual 2025 / PL médio (2025+2024)/2.
// '2024' usa lucro anual 2024 (soma dos semestres) / PL pontual 2024 (sem 2023 disponível para média).
// '2026-T1' usa lucro do trimestre anualizado (×4) / PL médio (2025+1T2026)/2.
// '2025-T1' usa lucro do trimestre anualizado (×4) / PL médio (2024+1T2025)/2.
// '2026-1S' usa lucro do semestre anualizado (×2) / PL médio (2025+1S2026)/2.
function roaeForBacen(k, period){
  if(period==='2026-1S'){
    const bdre = DATA.dre_bacen['2026-1S'][k];
    const lucro = (bdre && bdre.z!==null) ? bdre.z*2 : null;
    const plMedio = avg(DATA.bacen_bs[k].patrimonio_liquido[0], DATA.bacen_bs[k].patrimonio_liquido[4]);
    const p = safeDiv(lucro, plMedio);
    return p===null? null : p*100;
  }
  if(period==='2026-T1'){
    const bdre = DATA.dre_bacen['2026-T1'][k];
    const lucro = (bdre && bdre.z!==null) ? bdre.z*4 : null;
    const plMedio = avg(DATA.bacen_bs[k].patrimonio_liquido[0], DATA.bacen_bs[k].patrimonio_liquido[2]);
    const p = safeDiv(lucro, plMedio);
    return p===null? null : p*100;
  }
  if(period==='2025-T1'){
    const bdre = DATA.dre_bacen['2025-T1'][k];
    const lucro = (bdre && bdre.z!==null) ? bdre.z*4 : null;
    const plMedio = avg(DATA.bacen_bs[k].patrimonio_liquido[1], DATA.bacen_bs[k].patrimonio_liquido[3]);
    const p = safeDiv(lucro, plMedio);
    return p===null? null : p*100;
  }
  if(period==='2024'){
    const bdre = DATA.dre_bacen['2024'][k];
    const lucro = bdre ? bdre.z : null;
    const plRef = DATA.bacen_bs[k].patrimonio_liquido[1]; // pontual — sem PL de 2023 nesta fonte
    const p = safeDiv(lucro, plRef);
    return p===null? null : p*100;
  }
  const bdre = DATA.dre_bacen['2025'][k];
  const lucro = bdre ? bdre.z : null;
  const plMedio = avg(DATA.bacen_bs[k].patrimonio_liquido[0], DATA.bacen_bs[k].patrimonio_liquido[1]);
  const p = safeDiv(lucro, plMedio);
  return p===null? null : p*100;
}

// ============ HELPERS DE RANKING ============
function leaderLaggard(vals, higherIsBetter=true){
  // vals: {bank: number|null}
  const entries = Object.entries(vals).filter(([k,v])=>v!==null && v!==undefined && !isNaN(v));
  if(entries.length<2) return {leader:null, lag:null};
  entries.sort((a,b)=> higherIsBetter? b[1]-a[1] : a[1]-b[1]);
  return {leader:entries[0][0], lag:entries[entries.length-1][0]};
}

function fmtLabelValue(v){ // v já em R$ milhões -> formata em mi ou bi

  const abs = Math.abs(v);
  if(abs>=1000){
    return (v/1000).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' bi';
  }
  return v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' mi';
}

function makeBar(id, labels, values, colors, unit, isPct=false){

        }
      },
      scales:{
        y:{ display:false, grid:{display:false} },
        x:{grid:{display:false}, ticks:{font:{size:11.5}}}
      },
      responsive:true, maintainAspectRatio:false
    }
  });

}

function renderFidcCompTable(){
  const table = document.getElementById('fidcCompTable');
  table.style.tableLayout = 'fixed';
  table.style.width = '100%';
  table.style.minWidth = '100%';
  let colgroup = `<colgroup>
    <col style="width:8%">
    <col style="width:8%">
    <col style="width:16%">
    <col style="width:10%">
    <col style="width:58%">
  </colgroup>`;
  const thStyle = 'white-space:normal;word-break:break-word;box-sizing:border-box;';
  const tdStyle = 'white-space:normal;word-break:break-word;box-sizing:border-box;vertical-align:top;padding-top:10px;';
  let thead = `<thead><tr><th style="${thStyle}width:8%;">Banco</th><th style="${thStyle}width:8%;">Possui FIDC?</th><th style="${thStyle}width:16%;">Classificação das Cotas de Terceiros</th><th style="${thStyle}width:10%;">Efeito no PL Consolidado</th><th style="${thStyle}width:58%;">Detalhamento</th></tr></thead>`;
  let tbody = `<tbody>`;
  DATA.fidc_comparativo.forEach(f=>{
    const m = META[f.banco];
    tbody += `<tr><td style="${tdStyle}width:8%;"><b style="color:${m.color}">${m.short}</b></td><td style="${tdStyle}width:8%;">${f.tem_fidc? 'Sim':'Não'}</td><td style="${tdStyle}width:16%;font-size:13.5px;">${f.classificacao}</td><td style="${tdStyle}width:10%;">${f.efeito_pl? fmtMcell(f.efeito_pl)+' (NCI)' : (f.tem_fidc? 'R$ 0 (sem efeito)' : '—')}</td><td style="${tdStyle}width:58%;font-size:13.5px;text-align:left;">${f.tratamento}</td></tr>`;
  });
  tbody += `</tbody>`;
  table.innerHTML = colgroup+thead+tbody;

  // Igualar a altura de todas as linhas pela linha mais alta (ex.: STLA, com texto mais longo)
  requestAnimationFrame(()=>{
    const rows = table.querySelectorAll('tbody tr');
    let maxH = 0;
    rows.forEach(r=>{ r.querySelectorAll('td').forEach(td=>{ td.style.height='auto'; }); });
    rows.forEach(r=>{ maxH = Math.max(maxH, r.getBoundingClientRect().height); });
    rows.forEach(r=>{
      r.querySelectorAll('td').forEach(td=>{ td.style.height = maxH+'px'; });
    });
  });
}

function anrFor(k, yearIdx){
  const c = DATA.carteira[k];
  if(yearIdx===0){
    const m = avg(c.liquida[0], c.liquida[1]);
    return {value:m, isAvg: c.liquida[1]!==null};
  } else {
    return {value:c.liquida[1], isAvg:false};
  }
}

// ANR baseado no IF.data (Bacen) — usado nas páginas de fonte 'bacen' (Balanço Bacen, DRE Bacen, etc.).
// Carteira Líquida (Operações de Crédito) do Bacen. Índices: [0]=2025, [1]=2024, [2]=2026-T1, [3]=2025-T1, [4]=2026-1S.
// period '2025' (padrão) = média (2025+2024)/2; '2024' = saldo pontual 2024;
// '2026-T1' = média entre 2025 e o saldo do próprio trimestre; '2025-T1' = média entre 2024 e o saldo do próprio trimestre.
// '2026-1S' = média entre 2025 e o saldo do próprio semestre.
function anrForBacen(k, period){
  const c = DATA.bacen_bs[k].carteira_liquida;
  if(period==='2026-1S') return avg(c[0], c[4]);
  if(period==='2026-T1') return avg(c[0], c[2]);
  if(period==='2025-T1') return avg(c[1], c[3]);
  if(period==='2024') return c[1];
  return avg(c[0], c[1]);
}

  thead += `</tr><tr>`;
  ORDER.forEach(()=> thead += `<th style="font-size:10.5px;">R$ mi</th><th style="font-size:10.5px;">%ANR</th>`);
  thead += `</tr></thead>`;

  let tbody = `<tbody>`;
  // Linha de ANR (montante) — indicativo patrimonial, exibido como referência no topo da DRE
  tbody += `<tr class="subtotal"><td style="text-align:left;">ANR — Carteira Média (Average Net Receivables)</td>`;
  ORDER.forEach(k=>{
    const anr = anrFor(k, yearIdx);
    tbody += `<td>${fmtMcell(anr.value)}</td><td style="font-size:11.5px;"><span class="nd">—</span></td>`;
  });
  tbody += `</tr>`;
  DRE_ROWS.forEach(row=>{
    tbody += `<tr class="${row.subtotal?'subtotal':''}"><td style="text-align:left;">${row.label}</td>`;
    ORDER.forEach(k=>{
      const v = DATA.dre[k][row.key] ? DATA.dre[k][row.key][yearIdx] : null;
      const anr = anrFor(k, yearIdx);
      let pct = safeDiv(v, anr.value);
      let cell = 'N/D'; let cls='';
      if(pct!==null){
        pct = pct*100;
        cls = pct<0?'neg':'pos';
        cell = pct.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
      }
      tbody += `<td>${fmtMcell(v)}</td><td class="${cls}" style="font-size:11.5px;">${cell}</td>`;
    });
    tbody += `</tr>`;
  });
  tbody += `</tbody>`;
  table.innerHTML = colgroup+thead+tbody;
}

function renderDreBacenGenericTable(tableId, rowsArray, bacenData, period, showAnrRow){
  const table = document.getElementById(tableId);
  table.style.tableLayout = 'fixed';
  const ORDER_BACEN = ORDER.filter(k=> k!=='rci'); // RCI não aplicável ao IF.data (ver nota acima)
  const isQuarter = period==='2026-T1' || period==='2025-T1' || period==='2026-1S';
  let colgroup = `<colgroup><col style="width:26%">`;
  ORDER_BACEN.forEach(()=> colgroup += `<col style="width:9.25%"><col style="width:9.25%">`);
  colgroup += `</colgroup>`;

  let thead = `<thead><tr><th rowspan="2" style="text-align:left;">R$ milhões</th>`;
  ORDER_BACEN.forEach(k=> thead += `<th colspan="2">${META[k].short}</th>`);
  thead += `</tr><tr>`;
  ORDER_BACEN.forEach(()=> thead += `<th style="font-size:10.5px;">R$ mi</th><th style="font-size:10.5px;">%ANR${isQuarter?' (a.a.)':''}</th>`);
  thead += `</tr></thead>`;

  let tbody = `<tbody>`;
  if(showAnrRow){
    tbody += `<tr class="subtotal"><td style="text-align:left;">ANR — Carteira Média (Average Net Receivables)</td>`;
    ORDER_BACEN.forEach(k=>{
      const anr = anrForBacen(k, period);
      tbody += `<td>${fmtMcell(anr)}</td><td style="font-size:11.5px;"><span class="nd">—</span></td>`;
    });
    tbody += `</tr>`;
  }
  rowsArray.forEach(row=>{
    tbody += `<tr class="${row.subtotal?'subtotal':''}"><td style="text-align:left;">${row.label}</td>`;
    ORDER_BACEN.forEach(k=>{
      const v = bacenData[k] ? bacenData[k][row.key] : null;
      const anr = anrForBacen(k, period);
      const vAnualizado = (isQuarter && v!==null) ? v*bacenAnnualFactor(period) : v; // anualiza só para o %ANR, nunca o valor absoluto
      let pct = safeDiv(vAnualizado, anr);
      let cell = 'N/D'; let cls='';
      if(pct!==null){
        pct = pct*100;
        cls = pct<0?'neg':'pos';
        cell = pct.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
      }
      tbody += `<td>${fmtMcell(v)}</td><td class="${cls}" style="font-size:11.5px;">${cell}</td>`;
    });
    tbody += `</tr>`;
  });
  tbody += `</tbody>`;
  table.innerHTML = colgroup+thead+tbody;
}

function renderCompBacenGenericTable(tableId, rowsArray){
  const k = document.getElementById('compBacenEntidade').value;
  const periodA = document.getElementById('compBacenPeriodA').value;
  const periodB = document.getElementById('compBacenPeriodB').value;
  const isQuarterA = periodA==='2026-T1' || periodA==='2025-T1' || periodA==='2026-1S';
  const isQuarterB = periodB==='2026-T1' || periodB==='2025-T1' || periodB==='2026-1S';
  const dataA = DATA.dre_bacen[periodA][k];
  const dataB = DATA.dre_bacen[periodB][k];
  const anrA = anrForBacen(k, periodA);
  const anrB = anrForBacen(k, periodB);

  const table = document.getElementById(tableId);
  table.style.tableLayout = 'fixed';
  const colgroup = `<colgroup>
    <col style="width:28%"><col style="width:12%"><col style="width:12%">
    <col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%">
  </colgroup>`;

  const thead = `<thead><tr>
    <th rowspan="2" style="text-align:left;">R$ milhões</th>
    <th colspan="2">Período A</th><th colspan="2">Período B</th><th colspan="2" class="highlight-col">Δ (A - B)</th>
  </tr><tr>
    <th style="font-size:10.5px;">R$ mi</th><th style="font-size:10.5px;">%ANR</th>
    <th style="font-size:10.5px;">R$ mi</th><th style="font-size:10.5px;">%ANR</th>
    <th style="font-size:10.5px;" class="highlight-col">R$ mi</th><th style="font-size:10.5px;" class="highlight-col">p.p.</th>
  </tr></thead>`;

  const fmt1 = (v)=> v===null||v===undefined? '<span class="nd">N/D</span>' : v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
  // delta: verde quando positivo, vermelho quando negativo (diferente do fmtMcell padrão, que só colore negativo)
  const fmtDeltaM = (v)=> {
    if(v===null||v===undefined) return '<span class="nd">N/D</span>';
    const m = v/1000;
    const cls = m<0? 'valneg' : (m>0? 'valpos':'');
    const sign = m>0? '+':'';
    return `<span class="${cls}">${sign}${m.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})}</span>`;
  };
  const fmtD = (v)=> {
    if(v===null||v===undefined) return '<span class="nd">N/D</span>';
    const cls = v<0? 'valneg' : (v>0? 'valpos':'');
    return `<span class="${cls}">${(v>=0?'+':'')}${v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})}p.p.</span>`;
  };

  let tbody = `<tbody>`;
  rowsArray.forEach(row=>{
    const vA = dataA ? dataA[row.key] : null;
    const vB = dataB ? dataB[row.key] : null;
    const delta = (vA!==null && vA!==undefined && vB!==null && vB!==undefined) ? (vA-vB) : null;

    const vAanual = (isQuarterA && vA!==null && vA!==undefined) ? vA*bacenAnnualFactor(periodA) : vA;
    const vBanual = (isQuarterB && vB!==null && vB!==undefined) ? vB*bacenAnnualFactor(periodB) : vB;
    let pctA = safeDiv(vAanual, anrA); pctA = pctA===null? null : pctA*100;
    let pctB = safeDiv(vBanual, anrB); pctB = pctB===null? null : pctB*100;
    const deltaPct = (pctA!==null && pctB!==null) ? (pctA-pctB) : null;

    tbody += `<tr class="${row.subtotal?'subtotal':''}">
      <td style="text-align:left;">${row.label}</td>
      <td>${fmtMcell(vA)}</td><td>${fmt1(pctA)}</td>
      <td>${fmtMcell(vB)}</td><td>${fmt1(pctB)}</td>
      <td class="highlight-col">${fmtDeltaM(delta)}</td><td class="highlight-col">${fmtD(deltaPct)}</td>
    </tr>`;
  });
  tbody += `</tbody>`;
  table.innerHTML = colgroup+thead+tbody;
}

function fmtPctSigned(v){
  if(v===null||v===undefined||isNaN(v)) return '<span class="nd">N/D</span>';
  return v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
}

function renderComparisonTable(tableId, rows, opts={}){
  const table = document.getElementById(tableId);
  let thead = `<thead><tr><th>Indicador</th>`;
  ORDER.forEach(k=> thead += `<th>${META[k].short}</th>`);
  thead += `<th class="highlight-col">Melhor / Pior</th></tr></thead>`;
  let tbody = `<tbody>`;
  rows.forEach(r=>{
    const vals={};
    ORDER.forEach(k=>vals[k]=r.get(k));
    const rankVals = {...vals};
    if(r.excludeFromRanking){ r.excludeFromRanking.forEach(k=> delete rankVals[k]); }
    const {leader,lag} = r.better ? leaderLaggard(rankVals, r.better==='high') : {leader:null,lag:null};
    tbody += `<tr><td>${r.label}</td>`;
    ORDER.forEach(k=>{
      const v = vals[k];
      let cell;
      if(r.fmt==='m') cell = fmtMcell(v);
      else if(r.fmt==='pp') cell = (v===null||v===undefined)? '<span class="nd">N/D</span>' : v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' p.p.';
      else cell = fmtPctSigned(v);
      const asterisk = (r.excludeFromRanking && r.excludeFromRanking.includes(k)) ? ' <sup title="Ver nota">*</sup>' : '';
      tbody += `<td>${cell}${asterisk}</td>`;
    });
    // coluna final Melhor/Pior
    let hl = '<span class="nd">—</span>';
    if(leader && lag){
      hl = `<span class="tag lead">${META[leader].short}</span> <span class="tag lag">${META[lag].short}</span>`;
    } else if(!r.better){
      hl = '<span class="tag nd">N/A</span>';
    }
    tbody += `<td class="highlight-col">${hl}</td>`;
    tbody += `</tr>`;
  });
  tbody += `</tbody>`;
  table.innerHTML = thead+tbody;
}

function renderKpisBacenTable(){

  const isQuarter = period==='2026-T1' || period==='2025-T1' || period==='2026-1S';

  if(period==='2026-1S'){ pIdx=4; pIdxPrev=0; }
  else if(period==='2026-T1'){ pIdx=2; pIdxPrev=0; }
  else if(period==='2025-T1'){ pIdx=3; pIdxPrev=1; } // 1T2025 real (índice 3) vs. 2024 (ponta anterior)
  else if(period==='2024'){ pIdx=1; pIdxPrev=1; } // sem balanço de 2023 nesta fonte — usa 2024 pontual
  else { pIdx=0; pIdxPrev=1; }

  document.getElementById('kpisBacenPeriodAlert').innerHTML = period==='2026-1S'
    ? '<b>1S2026:</b> Lucro Líquido do semestre é anualizado (×2) para os indicadores de rentabilidade (ROAE, ROA, Custo de Crédito, NIM) — valores absolutos da DRE não são anualizados. PL/Ativo médios usam (2025 + 1S2026)/2.'
    : period==='2026-T1'
    ? '<b>1T2026:</b> Lucro Líquido do trimestre é anualizado (×4) para os indicadores de rentabilidade (ROAE, ROA, Custo de Crédito, NIM) — valores absolutos da DRE não são anualizados. PL/Ativo médios usam (2025 + 1T2026)/2.'
    : period==='2025-T1'
    ? '<b>1T2025:</b> Lucro Líquido do trimestre é anualizado (×4). PL/Ativo médios usam (2024 + 1T2025)/2, com balanço real do IF.data para o trimestre.'
    : period==='2024'
    ? '<b>2024:</b> Lucro Líquido anual (soma dos 2 semestres, layout Bacen anterior — algumas linhas N/D, ver alerta na DRE Bacen). PL/Ativo usam o saldo pontual de 2024 (sem 2023 disponível nesta fonte para média).'
    : '<b>2025:</b> Lucro Líquido anual (soma dos 2 semestres). PL/Ativo médios usam (2025 + 2024)/2.';

  const rows = [
    {label:'Carteira de Crédito (líquida)', get:k=>DATA.bacen_bs[k].carteira_liquida[pIdx], fmt:'m'},
    {label:'ANR — Carteira Média (Bacen)', get:k=>anrForBacen(k, period), fmt:'m'},
    {label:'Ativo Total', get:k=>DATA.bacen_bs[k].ativo_total[pIdx], fmt:'m'},
    {label:'Patrimônio Líquido', get:k=>DATA.bacen_bs[k].patrimonio_liquido[pIdx], fmt:'m'},
    {label:'Patrimônio Líquido Médio', get:k=>avg(DATA.bacen_bs[k].patrimonio_liquido[pIdx],DATA.bacen_bs[k].patrimonio_liquido[pIdxPrev]), fmt:'m'},
    {label:'Resultado Antes da Tributação / Ativo Total (%)', get:k=>{
        const bdre=DATA.dre_bacen[period][k];
        if(!bdre || bdre.w===null) return null;
        const w = isQuarter? bdre.w*bacenAnnualFactor(period) : bdre.w;
        const p = safeDiv(w, DATA.bacen_bs[k].ativo_total[pIdx]);
        return p===null? null : p*100;
      }, fmt:'p', better:'high'},
    {label:'Custo de Crédito / ANR (% a.a.)', get:k=>{
        const bdre=DATA.dre_bacen[period][k];
        if(!bdre || bdre.f===null) return null;
        const f = isQuarter? bdre.f*bacenAnnualFactor(period) : bdre.f;
        const p = safeDiv(f, anrForBacen(k, period));
        return p===null? null : Math.abs(p)*100;
      }, fmt:'p', better:'low'},
    {label:'ROAE — Lucro / PL Médio (%)', get:k=> roaeForBacen(k, period), fmt:'p', better:'high'},
    {label:'ROA — Lucro / Ativo Médio (%)', get:k=>{
        const bdre=DATA.dre_bacen[period][k];
        if(!bdre || bdre.z===null) return null;
        const z = isQuarter? bdre.z*bacenAnnualFactor(period) : bdre.z;
        const ativoMedio = avg(DATA.bacen_bs[k].ativo_total[pIdx],DATA.bacen_bs[k].ativo_total[pIdxPrev]);
        const p = safeDiv(z, ativoMedio);
        return p===null? null : p*100;
      }, fmt:'p', better:'high'},
    {label:'NIM (amplo) — Result. Intermediação Financ. / ANR (%)', get:k=>{
        const bdre=DATA.dre_bacen[period][k];
        if(!bdre || bdre.k===null) return null;
        const kk = isQuarter? bdre.k*bacenAnnualFactor(period) : bdre.k;
        const p = safeDiv(kk, anrForBacen(k, period));
        return p===null? null : p*100;
      }, fmt:'p', better:'high'},
    {label:'Índice de Eficiência (%)', get:k=>{
        const bdre=DATA.dre_bacen[period][k];
        if(!bdre || bdre.o===null || bdre.p===null || bdre.k===null) return null;
        const desp = Math.abs(bdre.o) + Math.abs(bdre.p);
        const rec = bdre.k + bdre.m + bdre.n;
        if(rec===0) return null;
        return (desp/rec)*100; // proporção não muda ao anualizar (numerador e denominador na mesma base trimestral)
      }, fmt:'p', better:'low'},
    {label:'Taxa Efetiva de Imposto (%)', get:k=>{
        const bdre=DATA.dre_bacen[period][k];
        if(!bdre || bdre.x===null || bdre.w===null) return null;
        const p = safeDiv(-bdre.x, bdre.w); // proporção não muda ao anualizar
        return p===null? null : p*100;
      }, fmt:'p', better:'low'},
  ];
  renderComparisonTable('kpisBacenTable', rows);
}

function indiceEficiencia(k){
  const d = DATA.dre[k];
  const desp = (d.despesas_pessoal && d.despesas_pessoal[0]!==null? Math.abs(d.despesas_pessoal[0]):0) + (d.despesas_adm && d.despesas_adm[0]!==null? Math.abs(d.despesas_adm[0]):0);
  const rec = (d.resultado_liquido_juros[0]||0) + (d.tarifas_servicos&&d.tarifas_servicos[0]||0) + (d.outras_receitas_op&&d.outras_receitas_op[0]||0);
  if(desp===0 || rec===0) return null;
  return (desp/rec)*100;
}

RENDER.captacao = function(){
  const el = document.getElementById('page-captacao');
  el.innerHTML = `
    <h1 class="page-title">Estrutura de Captação</h1>
    <div class="page-sub">Ano corrente (2025) — valores em R$ milhões</div>

    <div class="section-title">Mix de Funding por Produto (R$ milhões e % do total)</div>
    <div class="table-wrap"><table id="fundMixTable"></table></div>

    <div class="section-title">Custo Médio de Captação (Estimado) — Memória de Cálculo</div>
    <div class="page-sub" style="margin-bottom:12px;">Custo Médio = Despesa de Captação (juros pagos sobre depósitos, letras financeiras e empréstimos, excluindo ECL e FGC) ÷ Captação Total Média (2025+2024)/2 — metodologia de médias de dois períodos para indicadores de fluxo sobre estoque. É o custo médio do estoque, não o custo marginal de novas captações.</div>
    <div class="table-wrap"><table id="custoCaptTable"></table></div>

    <div class="section-title">Captação com Partes Relacionadas</div>
    <div class="page-sub" style="margin-bottom:12px;">Identificação de depósitos e instrumentos de captação junto a montadoras/distribuidoras e demais empresas do mesmo grupo econômico, conforme Nota de Partes Relacionadas de cada DF (31/12/2025).</div>
    <div class="table-wrap"><table id="partesRelTable"></table></div>
    <div class="comp-grid" id="partesRelDetalhe" style="margin-top:14px;"></div>
  `;

  // Tabela de mix — colunas pareadas R$/% por banco (lado a lado, não em linha separada)
  const produtos = [
    {key:'depositos', label:'Depósitos'},
    {key:'captacao_mercado', label:'Captação de Mercado (LF/LC/Aceites)'},
    {key:'emprestimos_exterior', label:'Empréstimos no Exterior'},
    {key:'cessao', label:'Securitização'},
  ];
  const mixTable = document.getElementById('fundMixTable');
  let thead = `<thead><tr><th rowspan="2">Produto</th>`;
  ORDER.forEach(k=> thead += `<th colspan="2" style="text-align:center;">${META[k].short}</th>`);
  thead += `</tr><tr>`;
  ORDER.forEach(()=> thead += `<th style="text-align:center;">R$ mi</th><th style="text-align:center;">%</th>`);
  thead += `</tr></thead>`;
  let tbody = `<tbody>`;
  produtos.forEach(p=>{
    tbody += `<tr><td>${p.label}</td>`;
    ORDER.forEach(k=>{
      const f = DATA.funding[k];
      const total = (f.depositos[0]||0)+(f.captacao_mercado[0]||0)+(f.emprestimos_exterior[0]||0)+(f.cessao[0]||0);
      const v = f[p.key][0];
      const pct = (v===null||v===undefined||total===0)? null : (v/total)*100;
      tbody += `<td>${fmtMcell(v)}</td><td>${pct===null? '<span class="nd">N/D</span>' : pct.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'}</td>`;
    });
    tbody += `</tr>`;
  });
  tbody += `<tr class="subtotal"><td>Total Captação</td>`;
  ORDER.forEach(k=>{
    const f = DATA.funding[k];
    const total = (f.depositos[0]||0)+(f.captacao_mercado[0]||0)+(f.emprestimos_exterior[0]||0)+(f.cessao[0]||0);
    tbody += `<td>${fmtMcell(total)}</td><td>100,0%</td>`;
  });
  tbody += `</tr></tbody>`;
  mixTable.innerHTML = thead+tbody;

  // Custo médio de captação — memória de cálculo completa
  function fundTotal(k, yearIdx){
    const f = DATA.funding[k];
    return (f.depositos[yearIdx]||0)+(f.captacao_mercado[yearIdx]||0)+(f.emprestimos_exterior[yearIdx]||0)+(f.cessao[yearIdx]||0);
  }
  const custoTable = document.getElementById('custoCaptTable');
  let cthead = `<thead><tr><th>Etapa do Cálculo</th>`;
  ORDER.forEach(k=> cthead += `<th>${META[k].short}</th>`);
  cthead += `<th class="highlight-col">Melhor / Pior</th></tr></thead>`;
  let ctbody = `<tbody>`;
  ctbody += `<tr><td>(a) Despesa de Captação — 2025</td>`;
  ORDER.forEach(k=> ctbody += `<td>${fmtMcell(DATA.despesa_captacao[k])}</td>`);
  ctbody += `<td class="highlight-col"><span class="tag nd">N/A</span></td></tr>`;
  ctbody += `<tr><td>(b) Captação Total — 2025 (ponta)</td>`;
  ORDER.forEach(k=> ctbody += `<td>${fmtMcell(fundTotal(k,0))}</td>`);
  ctbody += `<td class="highlight-col"><span class="tag nd">N/A</span></td></tr>`;
  ctbody += `<tr><td>(c) Captação Total — 2024 (ponta)</td>`;
  ORDER.forEach(k=> ctbody += `<td>${fmtMcell(fundTotal(k,1))}</td>`);
  ctbody += `<td class="highlight-col"><span class="tag nd">N/A</span></td></tr>`;
  ctbody += `<tr class="subtotal"><td>(d) Captação Média = [(b)+(c)] / 2</td>`;
  ORDER.forEach(k=> ctbody += `<td>${fmtMcell(avg(fundTotal(k,0),fundTotal(k,1)))}</td>`);
  ctbody += `<td class="highlight-col"><span class="tag nd">N/A</span></td></tr>`;

  const custoVals = {};
  ORDER.forEach(k=> custoVals[k] = safeDiv(DATA.despesa_captacao[k], avg(fundTotal(k,0),fundTotal(k,1)))*100 );
  const {leader:custoLead, lag:custoLag} = leaderLaggard(custoVals, false);
  ctbody += `<tr class="subtotal"><td>Custo Médio Estimado = (a) / (d)</td>`;
  ORDER.forEach(k=> ctbody += `<td>${fmtPctSigned(custoVals[k])}</td>`);
  ctbody += `<td class="highlight-col">${custoLead&&custoLag? `<span class="tag lead">${META[custoLead].short}</span> <span class="tag lag">${META[custoLag].short}</span>` : '<span class="nd">—</span>'}</td></tr>`;
  ctbody += `</tbody>`;
  custoTable.innerHTML = cthead+ctbody;

  // Partes relacionadas
  const prRows = [
    {label:'Captação com Partes Relacionadas', get:k=>DATA.partes_relacionadas[k].valor, fmt:'m'},
    {label:'% sobre Total de Depósitos', get:k=>DATA.partes_relacionadas[k].pct_depositos, fmt:'p', better:null},
  ];
  renderComparisonTable('partesRelTable', prRows);

  const detEl = document.getElementById('partesRelDetalhe');
  ORDER.forEach(k=>{
    const m = META[k]; const pr = DATA.partes_relacionadas[k];
    detEl.innerHTML += `
    <div class="comp-card" style="border-top:4px solid ${m.color}">
      <div class="head"><div class="dot" style="background:${m.color}"></div><div class="name">${m.short}</div></div>
      <dl><dd style="font-size:11.5px;line-height:1.55;">${pr.detalhe}</dd></dl>
    </div>`;
  });
};

      </div>
      <div class="card"><h3>Índice de Basileia</h3>
        <p style="margin:4px 0;">Mais capitalizado: <b style="color:${rkBas.leader?bankColor(rkBas.leader):'#999'}">${rkBas.leader?META[rkBas.leader].short:'N/D'}</b> (${fmtPctSigned(basileia[rkBas.leader])})</p>
        <p style="margin:4px 0;">Menos capitalizado: <b style="color:${rkBas.lag?bankColor(rkBas.lag):'#999'}">${rkBas.lag?META[rkBas.lag].short:'N/D'}</b> (${fmtPctSigned(basileia[rkBas.lag])})</p>
        <p style="font-size:11px;color:var(--text-mut);">RCI excluído do ranking (índice reflete o Conglomerado Santander, não o RCI isoladamente).</p>
      </div>
      <div class="card"><h3>Estágio 3 / Carteira Bruta</h3>
        <p style="margin:4px 0;">Melhor qualidade: <b style="color:${rkE3.leader?bankColor(rkE3.leader):'#999'}">${rkE3.leader?META[rkE3.leader].short:'N/D'}</b> (${fmtPctSigned(estagio3[rkE3.leader])})</p>
        <p style="margin:4px 0;">Pior qualidade: <b style="color:${rkE3.lag?bankColor(rkE3.lag):'#999'}">${rkE3.lag?META[rkE3.lag].short:'N/D'}</b> (${fmtPctSigned(estagio3[rkE3.lag])})</p>
        <p style="font-size:11px;color:var(--text-mut);">GM: N/D (sem tabela de estágios divulgada, apenas aging). STLA: Estágio 3 disponível somente para 2025.</p>
      </div>
    </div>
    <div class="section-title">Alertas de Comparabilidade e Governança de Dados</div>
    <div class="alert-bar">
      <b>1. Padrão contábil misto:</b> IFRS (Toyota, Volkswagen, GM) vs. BR GAAP/COSIF (STLA, RCI) — comparações diretas de margens e provisões requerem cautela.<br>
      <b>2. Res. CMN 4.966/21 (vigente desde 2025):</b> aplica-se a todas as instituições reguladas pelo Bacen, alinhando o BR GAAP/COSIF ao IFRS 9 — Toyota e GM citam a norma no DF (impacto pontual, já reportavam ECL via IFRS 9). Para STLA e RCI, que reportam em BR GAAP/COSIF, a mudança é estrutural: migração do modelo de perdas incorridas (rating C1-C5 / AA-H) para Estágios 1/2/3. Balanço, DRE e carteira de crédito de 2024/2023 estão disponíveis para os dois e são comparáveis; a qualidade de crédito por estágio não é diretamente comparável entre 2025 e os anos anteriores, por mudança de modelo (não de risco).<br>
      <b>3. Perímetro societário da STLA:</b> Stellantis Financiamentos, Banco Stellantis e os FIDCs (Vita Auto, MOAB, Mobility I e II) já compunham o conglomerado prudencial desde 2023 — o crescimento de ativos observado é predominantemente orgânico, não decorrente de fusão.<br>
      <b>4. Basileia:</b> GM não divulga o índice no próprio DF, mas o valor foi obtido diretamente do Bacen (IF.data) e incorporado ao dashboard. RCI apura em conjunto com o Conglomerado Santander (sem índice individual em nenhuma fonte, incluindo o Bacen).<br>
      <b>5. Estágios / qualidade de crédito:</b> GM não detalha Estágio 1/2/3 em tabela numérica em nenhum ano (usa aging). STLA divulga Estágio 1/2/3 apenas para 2025 (Nota 7.d); 2024/2023 usavam o modelo de rating C1-C5 (anterior à Res. 4.966/21). RCI usava o modelo de rating AA-H até 2024/2023.<br>
      <b>6. Métricas não disponíveis nas DFs:</b> Ticket médio, penetração de financiamento sobre vendas, spread implícito por contrato e custo por contrato exigem dados de originação/produção não divulgados nas Demonstrações Financeiras — não fabricados neste dashboard.
    </div>
  `;
};

// ============ PÁGINA: KEY HIGHLIGHTS ============
RENDER.highlights = function(){
  const el = document.getElementById('page-highlights');
  const isBacen = currentSource === 'bacen';
  let cards = '';

  const RATIONALE = {
    stla: [
      `Lucro líquido cresceu 70,1% e a carteira bruta 58,3% — expansão consistente com o mesmo perímetro societário desde 2023 (não há efeito de fusão/aquisição distorcendo a comparação).`,
      `Queda do Índice de Basileia (17,87% → 14,85%) reflete o RWA crescendo mais rápido que o capital, dado o forte ritmo de expansão da carteira — ponto de atenção para monitorar via KPI's de Capital.`
    ],
    gm: [
      `FIDC (Financiamento a Concessionárias) foi descontinuado em dez/2025 — reduz uma fonte de funding e de diversificação de risco, mas também tira RWA do balanço.`,
      `Queda de 22,4% no lucro líquido: Resultado Líquido de Juros retraiu (R$1.606,8 mi → R$1.469,0 mi) mesmo com a carteira praticamente estável (+0,1%) — sugere pressão de custo de captação sobre a margem.`,
      `Índice de Basileia subiu (18,78% → 19,14%), consistente com portfólio estável e a descontinuação do FIDC.`
    ],
    toyota: [
      `Lucro líquido caiu 19,0% (R$299,2 mi → R$242,5 mi), puxado por uma reversão de R$389,7 mi em "Ganhos (Perdas) com Ativos e Passivos Financeiros" — em 2024 essa linha foi positiva em R$348,1 mi, um swing de ~R$738 mi entre os períodos, provavelmente ligado a marcação a mercado de instrumentos financeiros/hedge cambial da matriz.`,
      `Em contrapartida, despesa de juros caiu com força (R$1.606,2 mi → R$1.104,7 mi), indicando custo de captação mais baixo no período.`,
      `Basileia caiu de 15,50% para 12,99%, com RWA crescendo mais que o capital.`
    ],
    volks: [
      `Lucro líquido subiu 30,1% (R$812,9 mi → R$1.057,8 mi), apoiado pelo crescimento da carteira (+12,6%) e por um efeito não recorrente: transferência das operações de financiamento de caminhões e ônibus para o Banco Traton do Brasil, que gerou R$198,6 mi em outras receitas operacionais em 2025 (zero em 2024) — vale isolar esse efeito ao projetar recorrência de resultado.`,
      `Basileia subiu ligeiramente (12,48% → 12,94%), com o PL crescendo (+11,7%) em ritmo próximo ao do RWA.`
    ],
    rci: [
      `Lucro líquido subiu 44,3% (R$239,8 mi → R$346,1 mi), impulsionado principalmente por uma forte queda na despesa de provisão para perdas esperadas (R$140,0 mi em 2024 para R$29,2 mi em 2025 — redução de R$110,8 mi) — sinaliza melhora na qualidade de crédito ou menor necessidade de reforço de provisão no período, não necessariamente ganho operacional recorrente.`
    ]
  };

  if(isBacen){
    ORDER.forEach(k=>{
      const m = META[k];
      const bs = DATA.bacen_bs[k];
      const bdre = DATA.dre_bacen['2025'][k];
      const hasPrev = bs.ativo_total[1]!==null;
      const ativoVar = hasPrev? safeDiv(bs.ativo_total[0]-bs.ativo_total[1], bs.ativo_total[1])*100 : null;
      const carteiraVar = bs.carteira_bruta[1]!==null? safeDiv(bs.carteira_bruta[0]-bs.carteira_bruta[1], bs.carteira_bruta[1])*100 : null;
      const basVar = (DATA.basileia[k][0]!==null && DATA.basileia[k][1]!==null)? (DATA.basileia[k][0]-DATA.basileia[k][1]) : null;

      let items = [];
      if(bdre && bdre.z!==null){
        items.push(`Lucro líquido de R$ ${fmtM(bdre.z)} milhões em 2025 (Bacen) — sem comparativo 2024 nesta fonte (DRE Bacen disponível só para 2025).`);
      } else {
        items.push(`Lucro líquido não disponível individualmente no IF.data (apurado em conjunto com o Conglomerado Santander).`);
      }
      items.push(`Ativo total de R$ ${fmtM(bs.ativo_total[0])} milhões${ativoVar!==null? ` (${ativoVar>=0?'+':''}${ativoVar.toFixed(1)}% vs. 2024)`:''}.`);
      items.push(`Carteira de crédito bruta de R$ ${fmtM(bs.carteira_bruta[0])} milhões${carteiraVar!==null? ` (${carteiraVar>=0?'+':''}${carteiraVar.toFixed(1)}% vs. 2024)`:''}.`);
      if(DATA.basileia[k][0]!==null && k!=='rci'){
        items.push(`Índice de Basileia em ${DATA.basileia[k][0].toFixed(2)}%${basVar!==null? ` (${basVar>=0?'+':''}${basVar.toFixed(2)} p.p. vs. 2024)`:''}.`);
      } else if(k==='rci'){
        items.push(`Índice de Basileia do Conglomerado Santander (do qual o RCI faz parte para fins de capital): ${DATA.basileia[k][0].toFixed(2)}% — não é um índice isolado do RCI.`);
      }
      if(k==='rci') items.push(`RCI não aparece individualmente no IF.data — Ativo, Carteira e Lucro Líquido acima não disponíveis nesta fonte.`);

      cards += `<div class="hl-card"><div class="stripe" style="background:${m.color}"></div><h4>${m.name}</h4><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
    });
    el.innerHTML = `
      <h1 class="page-title">Key Highlights — Bacen (BRGAAP)</h1>
      <div class="page-sub">Base IF.data — 2025 vs. 2024 para Ativo/Carteira/Basileia; Lucro Líquido apenas 2025 (DRE Bacen 2024 ainda não disponível).</div>
      <div class="hl-grid">${cards}</div>
    `;
    return;
  }

  ORDER.forEach(k=>{
    const m = META[k];
    const d = DATA.dre[k]; const b = DATA.bs[k]; const c = DATA.carteira[k];
    const hasPrev = b.pl[1]!==null && b.ativo[1]!==null;
    const llVar = hasPrev? safeDiv(d.lucro_liquido[0]-d.lucro_liquido[1], Math.abs(d.lucro_liquido[1]))*100 : null;
    const ativoVar = hasPrev? safeDiv(b.ativo[0]-b.ativo[1], b.ativo[1])*100 : null;
    const carteiraVar = c.bruta[1]!==null? safeDiv(c.bruta[0]-c.bruta[1], c.bruta[1])*100 : null;
    const basVar = (DATA.basileia[k][0]!==null && DATA.basileia[k][1]!==null)? (DATA.basileia[k][0]-DATA.basileia[k][1]) : null;

    let items = [];
    items.push(`Lucro líquido de R$ ${fmtM(d.lucro_liquido[0])} milhões em 2025${llVar!==null? ` (${llVar>=0?'+':''}${llVar.toFixed(1)}% vs. 2024)`:' (sem comparativo 2024 disponível)'}.`);
    items.push(`Ativo total de R$ ${fmtM(b.ativo[0])} milhões${ativoVar!==null? ` (${ativoVar>=0?'+':''}${ativoVar.toFixed(1)}% vs. 2024)`:''}.`);
    items.push(`Carteira de crédito bruta de R$ ${fmtM(c.bruta[0])} milhões${carteiraVar!==null? ` (${carteiraVar>=0?'+':''}${carteiraVar.toFixed(1)}% vs. 2024)`:''}.`);
    if(DATA.basileia[k][0]!==null && k!=='rci'){
      items.push(`Índice de Basileia em ${DATA.basileia[k][0].toFixed(2)}%${basVar!==null? ` (${basVar>=0?'+':''}${basVar.toFixed(2)} p.p. vs. 2024)`:''}.`);
    } else if(k==='rci'){
      items.push(`Índice de Basileia do Conglomerado Santander (do qual o RCI faz parte para fins de capital): ${DATA.basileia[k][0].toFixed(2)}% — não é um índice isolado do RCI.`);
    } else {
      items.push(`Índice de Basileia não divulgado individualmente no DF.`);
    }
    if(k==='stla') items.push(`Perímetro do conglomerado (Stellantis Financiamentos + Banco Stellantis + FIDCs) é o mesmo desde 2023 — crescimento de ativos é predominantemente orgânico. Qualidade de crédito por estágio não é comparável a 2024/2023 (mudança de modelo pela Res. 4.966/21).`);
    if(k==='rci') items.push(`Balanço, DRE e carteira comparáveis a 2024/2023. Qualidade de crédito por estágio não é comparável (2024/2023 usam rating AA-H; 2025 usa Estágios 1/2/3, Res. 4.966/21).`);

    const rationale = RATIONALE[k] || [];
    const rationaleHtml = rationale.length ? `
      <div class="rationale">
        <div class="rationale-title">Racional / Contexto Operacional</div>
        <ul>${rationale.map(r=>`<li>${r}</li>`).join('')}</ul>
      </div>` : '';

    cards += `<div class="hl-card"><div class="stripe" style="background:${m.color}"></div><h4>${m.name}</h4><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul>${rationaleHtml}</div>`;
  });
  el.innerHTML = `
    <h1 class="page-title">Key Highlights — 2025 vs. 2024</h1>
    <div class="page-sub">Leitura objetiva por instituição, com base nos dados extraídos das Demonstrações Financeiras.</div>
    <div class="hl-grid">${cards}</div>
  `;
};

// ============ INIT ============
showPage('geral');





























</script>
</body>
</html>
